<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AegisQ — Quantum-Safe Intelligence</title>
<style>
:root{--bg:#07111F;--sb:#0B1728;--card:#101F33;--blue:#36AFFF;--cy:#28E0D0;--red:#ff4d5e;--amb:#ffb020;--grn:#38d996;--tx:#eaf2ff;--mu:#8ea3bf;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:var(--sb);border-right:1px solid #1b3350;padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:22px}.logo b{letter-spacing:3px;font-size:17px}.logo small{display:block;color:var(--mu);font-size:9px;letter-spacing:1.5px}
nav button{display:flex;gap:10px;width:100%;background:none;border:0;color:var(--mu);padding:10px;border-radius:8px;cursor:pointer;font:inherit;text-align:left}
nav button:hover{color:var(--tx)}nav button.on{background:#13304f;color:var(--tx);box-shadow:inset 3px 0 var(--blue)}
main{flex:1;min-width:0;padding:22px 26px;animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:var(--mu);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);margin-right:6px}
h1{margin:0 0 4px;font-size:24px}h3{margin:0 0 10px;font-size:13px;letter-spacing:1px;color:var(--cy);text-transform:uppercase}
.g{display:grid;gap:14px;margin-bottom:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.c{background:var(--card);border:1px solid #1e4066;border-radius:12px;padding:16px;box-shadow:0 0 18px #36afff14}
.stat b{display:block;font-size:34px;color:var(--blue)}.stat span{color:var(--mu);font-size:12px}
.btn{background:linear-gradient(90deg,#1b7fd1,var(--blue));color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:600 13px inherit;font-family:inherit}.btn.o{background:none;border:1px solid var(--blue);color:var(--blue)}
.tag{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;color:#06101c;white-space:nowrap}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px}th{color:var(--mu);text-align:left;font-weight:500;padding:8px;border-bottom:1px solid #26476e}td{padding:8px;border-bottom:1px solid #162b46;vertical-align:top}
code{background:#091524;padding:2px 6px;border-radius:5px;color:var(--cy);font-size:12px}
.br{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;margin:7px 0;font-size:12px}.br i{display:block;height:10px;border-radius:5px;transition:width .6s}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mu)}.lg u{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;text-decoration:none}
.log{background:#050d18;border-radius:8px;padding:10px;height:150px;overflow:auto;font:12px ui-monospace,monospace;color:var(--cy)}
input[type=range]{width:100%;accent-color:var(--blue)}.step{display:flex;gap:12px}.step>b{flex:0 0 34px;height:34px;border-radius:50%;background:#13304f;border:1px solid var(--blue);display:grid;place-items:center;color:var(--cy)}
.spin{transform-origin:100px 100px;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:760px){aside{display:none}main{padding:14px}}
@media print{aside,.np{display:none}body{background:#fff;color:#000}.c{background:#fff;border-color:#999;box-shadow:none}th,td{color:#000}}
</style><link rel="stylesheet" href="static/assistant.css"></head><body>
<aside><div class="logo"><svg width="38" height="42" viewBox="0 0 80 92"><path d="M40 4 74 16V44C74 66 58 80 40 88 22 80 6 66 6 44V16Z" fill="#0f2a47" stroke="#36AFFF" stroke-width="3"/><text x="40" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#28E0D0">Q</text></svg><div><b>AEGISQ</b><small>QUANTUM-SAFE INTELLIGENCE</small></div></div><nav id="nav"></nav></aside>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={a:[],X:15,Y:4,Z:12,v:'ov',t:null};
const COL={Critical:'#ff4d5e',High:'#ff8a3d',Medium:'#ffb020',Low:'#38d996','Needs review':'#9a8cff'};
const NAV=[['ov','⌂','Overview'],['sc','⌕','Discovery Scanner'],['inv','▦','Cryptographic Inventory'],['rk','⚖','Risk Assessment'],['sim','⏱','Threat Simulator'],['adv','⛨','PQC Advisor'],['rm','➤','Migration Roadmap'],['rp','⎙','Reports']];
const DEMO={'medivault/auth/login.py':'from Crypto.PublicKey import RSA\nkey = RSA.generate(2048)  # patient login token','medivault/exchange/record_share.py':'curve = ec.SECP256R1()\nshared = priv.exchange(ec.ECDH(), peer)  # ECC record exchange','medivault/consent/sign_consent.py':'sig = key.sign(doc, ec.ECDSA(hashes.SHA256()))  # consent signature','medivault/storage/vault_crypto.py':'cipher = AES.new(key, AES.MODE_GCM)  # AES-256 medical record encryption','medivault/config/nginx.conf':'ssl_protocols TLSv1.2 TLSv1.3;','medivault/config/cert_config.yaml':'cert_file: /etc/medivault/server.crt  # X.509 reference'};
const RULES=[['RSA',/\bRSA\b|rsa\./i,'Key establishment'],['ECDSA',/ECDSA/i,'Digital signature'],['ECC',/\bECC\b|ECDH|SECP256|P-256/i,'Key establishment'],['AES',/\bAES/i,'Data encryption'],['TLS',/TLSv?1\.[0-3]|ssl_protocols|\bTLS\b/,'Transport security'],['X.509',/BEGIN CERTIFICATE|\.crt|\.pem|x\.?509/i,'Certificate']];
const META=[[/auth|login/,'Patient credentials',5,2,'Medium'],[/exchange|share/,'Patient records',15,4,'High'],[/consent/,'Consent forms',10,3,'High'],[/vault|storage|crypt/,'Medical records',15,4,'High'],[/nginx|tls|conf/,'API traffic',5,2,'Medium'],[/cert/,'Identity certificates',3,1,'Medium']];
const PQC={RSA:['ML-KEM (FIPS 203)','Larger keys/ciphertexts; pilot a hybrid RSA+ML-KEM mode first.'],ECC:['ML-KEM (FIPS 203)','Check handshake size and library support; use hybrid key exchange during transition.'],ECDSA:['ML-DSA (FIPS 204) or SLH-DSA (FIPS 205)','Signatures are larger; verify storage and legal-validity requirements for consent records.'],AES:['Keep AES-256; evaluate key size','Symmetric crypto is assessed separately: confirm 256-bit keys and key management.'],TLS:['Hybrid PQ key exchange in TLS 1.3','Needs server and client library support; benchmark latency before rollout.'],'X.509':['PQC / hybrid certificates','Depends on CA and PKI tooling; plan after pilots.']};
const cls=a=>a.alg=='AES'?(/128/.test(a.snip)?'Needs review':'Low'):a.conf<.6?'Needs review':(a.life+a.mig>=S.Z?(a.crit=='High'?'Critical':'High'):'Medium');
function detect(files){let n=0,out=[];for(const[p,t]of Object.entries(files)){const L=t.split('\n');const m=META.find(x=>x[0].test(p.toLowerCase()))||[0,'General data',5,2,'Medium'];for(const[alg,re,pur]of RULES){const i=L.findIndex(l=>re.test(l));if(i<0)continue;const sn=L[i].trim();out.push({id:'AQ-'+String(++n).padStart(3,'0'),app:'MediVault',alg,pur,file:p,line:i+1,snip:sn,conf:/[(=:]/.test(sn)?.9:.6,cat:m[1],life:m[2],mig:m[3],crit:m[4]});}}return out}
const donut=(d,c)=>{const T=d.reduce((s,x)=>s+x[1],0)||1,R=48,C=2*Math.PI*R;let o=0;return`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><svg width="130" height="130" viewBox="0 0 140 140"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#0a1a2e" stroke-width="18"/>${d.map(x=>{const l=x[1]/T*C,e=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${x[2]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 70 70)"/>`;o+=l;return e}).join('')}<text x="70" y="76" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf2ff">${c}</text></svg><div class="lg" style="flex-direction:column">${d.map(x=>`<span><u style="background:${x[2]}"></u>${x[0]} · ${x[1]}</span>`).join('')}</div></div>`};
const bars=d=>{const M=Math.max(...d.map(x=>x[1]),1);return d.map(x=>`<div class="br"><span>${esc(x[0])}</span><i style="width:${x[1]/M*100}%;background:${x[2]}"></i><b>${x[1]}</b></div>`).join('')};
const tag=c=>`<span class="tag" style="background:${COL[c]}">${c}</span>`;
const count=(k,f)=>{const m={};S.a.forEach(a=>{const v=f(a);m[v]=(m[v]||0)+1});return Object.entries(m)};
const hero=`<div class="c" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#0f2a47,#101F33)"><svg width="90" height="100" viewBox="0 0 80 92"><path d="M40 4 74 16V44C74 66 58 80 40 88 22 80 6 66 6 44V16Z" fill="#0b1c30" stroke="#28E0D0" stroke-width="2.5"/><text x="40" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#36AFFF">Q</text></svg><div style="flex:1;min-width:240px"><h1>From cryptographic visibility to quantum-safe readiness</h1><div style="color:var(--cy);letter-spacing:3px;font-size:12px">DISCOVER · ASSESS · SIMULATE · MODERNISE</div><p style="color:var(--mu);margin:8px 0 0">Finds quantum-vulnerable cryptography, weighs it against DATA LIFETIME, and tells you what to migrate first.</p></div></div>`;
const flow=`<div class="c np"><h3>Pipeline</h3><svg viewBox="0 0 760 90" width="100%">${['Software input','Discovery','CBOM','Risk + Mosca','PQC advice','Report'].map((t,i)=>`<g><rect x="${i*127}" y="14" width="110" height="52" rx="10" fill="#0b1c30" stroke="${i==3?'#28E0D0':'#36AFFF'}"/><text x="${i*127+55}" y="45" text-anchor="middle" font-size="12" fill="#eaf2ff">${t}</text>${i<5?`<path d="M${i*127+112} 40h13" stroke="#28E0D0" stroke-width="2"/>`:''}</g>`).join('')}</svg></div>`;
const V={};
V.ov=()=>{if(!S.a.length)return`<div class="top"><span><span class="dot"></span>Local · offline</span><span>No scan yet</span></div>${hero}<div class="c" style="margin-top:14px;text-align:center"><svg width="120" height="120" viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="#1e4066"/><circle cx="100" cy="100" r="55" fill="none" stroke="#1e4066"/><g class="spin"><path d="M100 100 100 10A90 90 0 0 1 164 36Z" fill="#36AFFF" opacity=".35"/></g></svg><p>Run the MediVault demo scan to populate every module.</p><button class="btn" onclick="demo()">▶ Scan MediVault demo project</button></div>${flow}`;
const A=S.a,v=A.filter(a=>a.alg!='AES'),cr=A.filter(a=>cls(a)=='Critical');
const rk=Object.keys(COL).map(k=>[k,A.filter(a=>cls(a)==k).length,COL[k]]).filter(x=>x[1]);
const al=count(0,a=>a.alg).map(x=>[x[0],x[1],'#36AFFF']);
const lf=[['≤ 5 yrs',A.filter(a=>a.life<=5).length,'#38d996'],['6–10 yrs',A.filter(a=>a.life>5&&a.life<=10).length,'#ffb020'],['11+ yrs',A.filter(a=>a.life>10).length,'#ff4d5e']];
const top=[...A].filter(a=>cls(a)=='Critical').slice(0,4);
return`<div class="top"><span><span class="dot"></span>Local · offline · Z = ${S.Z} yrs</span><span>Latest scan: ${S.t}</span></div><h1>Security command center</h1><p style="color:var(--mu)">Statistics are calculated from the current inventory.</p><div class="g g4"><div class="c stat"><b>${A.length}</b><span>Assets discovered</span></div><div class="c stat"><b>${v.length}</b><span>Quantum-vulnerable findings</span></div><div class="c stat"><b style="color:var(--red)">${cr.length}</b><span>Critical-priority assets</span></div><div class="c stat"><b>${al.length}</b><span>Algorithms detected</span></div></div><div class="g g2"><div class="c"><h3>Risk distribution</h3>${donut(rk,A.length)}</div><div class="c"><h3>Algorithm distribution</h3>${donut(al.map((x,i)=>[x[0],x[1],['#36AFFF','#28E0D0','#9a8cff','#ffb020','#ff8a3d','#38d996'][i%6]]),A.length)}</div><div class="c"><h3>Assets by component</h3>${bars(count(0,a=>a.file.split('/').slice(-2)[0]).map(x=>[x[0],x[1],'#36AFFF']))}</div><div class="c"><h3>Data lifetime distribution</h3>${bars(lf)}</div></div><div class="c"><h3>Highest-priority findings</h3>${top.map(a=>`<div style="display:flex;gap:10px;align-items:center;padding:6px 0">${tag('Critical')}<b>${a.alg}</b><span style="color:var(--mu)">${a.cat} · ${a.life}y + ${a.mig}y migration · ${a.file.split('/').pop()}</span></div>`).join('')||'<span style="color:var(--mu)">None at the current Z.</span>'}</div>`};
V.sc=()=>`<h1>Discovery Scanner</h1><p style="color:var(--mu)">A match is evidence of a cryptographic <i>reference</i>, not proof it protects production data.</p><div class="g g2"><div class="c"><h3>Scan source</h3><button class="btn" onclick="demo()">▶ Demo: MediVault Healthcare Records</button><p style="color:var(--mu)">or upload a ZIP (≤10 MB, ≤300 text/config files, path-traversal blocked, nothing executed, in-memory only, works offline):</p><input type="file" accept=".zip" onchange="up(this.files[0])"><div class="lg" style="margin-top:12px">${RULES.map(r=>`<span><u style="background:#36AFFF"></u>${r[0]}</span>`).join('')}</div></div><div class="c" style="text-align:center"><svg width="170" height="170" viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="#1e4066"/><circle cx="100" cy="100" r="55" fill="none" stroke="#1e4066"/><circle cx="100" cy="100" r="20" fill="none" stroke="#1e4066"/><g class="spin"><path d="M100 100 100 10A90 90 0 0 1 164 36Z" fill="#28E0D0" opacity=".4"/></g></svg><div id="pr" style="color:var(--mu)">Idle</div></div></div><div class="c"><h3>Live scan log</h3><div class="log" id="log"></div></div>`;
V.inv=()=>`<h1>Cryptographic Inventory (CBOM)</h1><p style="color:var(--mu)">Simplified CBOM inspired by CycloneDX — not claimed as schema-compliant.</p><div class="c tw"><table><tr><th>ID</th><th>Algorithm</th><th>Purpose</th><th>File : line</th><th>Evidence</th><th>Data</th><th>Life</th><th>Mig.</th><th>Conf.</th><th>Priority</th></tr>${S.a.map(a=>`<tr><td>${a.id}</td><td><b>${a.alg}</b></td><td>${a.pur}</td><td>${esc(a.file.split('/').pop())}:${a.line}</td><td><code>${esc(a.snip.slice(0,46))}</code></td><td>${a.cat}</td><td>${a.life}y</td><td>${a.mig}y</td><td>${Math.round(a.conf*100)}%</td><td>${tag(cls(a))}</td></tr>`).join('')||'<tr><td colspan=10>Run a scan first.</td></tr>'}</table></div>`;
V.rk=()=>{const R=['RSA','ECC','ECDSA','TLS','X.509','AES'],mx=Math.max(S.Z+4,...S.a.map(a=>a.life+a.mig))+2,w=640/mx;return`<h1>Risk Assessment</h1><p style="color:var(--mu)">Transparent rules: public-key use + (data lifetime + migration time ≥ Z) → High; + High business criticality → Critical; AES judged on key size; low-confidence evidence → Needs review.</p><div class="c"><h3>Mosca matrix — X+Y vs Z=${S.Z}</h3><svg viewBox="0 0 740 260" width="100%"><rect x="${70+S.Z*w}" y="10" width="${640-S.Z*w}" height="215" fill="#ff4d5e" opacity=".12"/><line x1="${70+S.Z*w}" x2="${70+S.Z*w}" y1="10" y2="225" stroke="#ff4d5e" stroke-dasharray="5"/>${R.map((r,i)=>`<text x="62" y="${40+i*34}" text-anchor="end" font-size="12" fill="#8ea3bf">${r}</text><line x1="70" x2="710" y1="${36+i*34}" y2="${36+i*34}" stroke="#16304d"/>`).join('')}${S.a.map((a,i)=>`<circle cx="${70+(a.life+a.mig)*w}" cy="${36+R.indexOf(a.alg)*34-(i%3)*6}" r="9" fill="${COL[cls(a)]}"><title>${a.id} ${a.cat}</title></circle>`).join('')}<text x="710" y="248" text-anchor="end" font-size="11" fill="#8ea3bf">X + Y (years) →</text></svg><div class="lg">${Object.keys(COL).map(k=>`<span><u style="background:${COL[k]}"></u>${k}</span>`).join('')}</div></div>`};
V.sim=()=>`<h1>Quantum Threat Simulator</h1><p style="color:var(--mu)">Planning model, not a prediction of when quantum computers arrive. Z also drives the inventory and risk views.</p><div class="g g2"><div class="c">${[['X','Data lifetime',1,30,'X'],['Y','Migration time',1,10,'Y'],['Z','Threat horizon',3,30,'Z']].map(s=>`<label>${s[1]} (${s[0]}): <b id="v${s[0]}">${S[s[0]]}</b> yrs</label><input type="range" min="${s[2]}" max="${s[3]}" value="${S[s[0]]}" oninput="S.${s[0]}=+this.value;sim()">`).join('<br>')}</div><div class="c" id="so"></div></div>`;
V.sim.after=()=>sim();
V.adv=()=>{const g=[...new Set(S.a.map(a=>a.alg))];return`<h1>PQC Advisor</h1><p style="color:var(--mu)">Deterministic rules mapped to cryptographic purpose.</p>${g.map(k=>{const f=S.a.filter(a=>a.alg==k);return`<div class="c" style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="tag" style="background:#ff8a3d">${k}</span><span style="color:var(--cy);font-size:20px">➜</span><span class="tag" style="background:#28E0D0">${PQC[k][0]}</span><span style="color:var(--mu)">${f.length} finding(s)</span></div><p><b>Why:</b> ${k=='AES'?'Symmetric; Grover only halves effective strength.':'Public-key math (factoring / discrete log) is exposed to a future quantum computer, and harvested data may be decrypted later.'}<br><b>Compatibility:</b> ${PQC[k][1]}<br><b>Applies to:</b> ${f.map(a=>a.file.split('/').pop()).join(', ')}</p></div>`}).join('')||'Run a scan first.'}`};
V.rm=()=>{const A=S.a,h=A.filter(a=>['Critical','High'].includes(cls(a)));const P=[['Validate discovery evidence',`${A.length} findings to confirm with code owners`],['Identify affected applications',[...new Set(h.map(a=>a.cat))].join(', ')||'—'],['Evaluate PQC compatibility',[...new Set(h.map(a=>PQC[a.alg][0]))].join(' · ')||'—'],['Conduct controlled pilot','Hybrid mode on the Critical assets first'],['Validate and plan migration',`${h.length} high-priority assets scheduled`],['Monitor and maintain inventory','Rescan after every release']];return`<h1>Migration Roadmap</h1><div class="c">${P.map((p,i)=>`<div class="step" style="margin-bottom:${i<5?14:0}px"><b>${i+1}</b><div><b>${p[0]}</b><div style="color:var(--mu)">${esc(p[1])}</div></div></div>`).join('')}</div>`};
V.rp=()=>`<div class="np" style="display:flex;justify-content:space-between"><h1>Assessment Report</h1><button class="btn" onclick="print()">⬇ Download PDF (Print → Save as PDF)</button></div><div class="c"><h3>AegisQ assessment · MediVault · ${S.t||'no scan'}</h3><p>${S.a.length} assets, ${S.a.filter(a=>cls(a)=='Critical').length} critical at Z=${S.Z} yrs. Findings are evidence of references, not proof of production use.</p></div>${V.inv().replace(/<h1>.*?<\/p>/,'')}<div class="c" style="margin-top:12px"><h3>Recommended next actions</h3>${[...new Set(S.a.map(a=>a.alg))].map(k=>`<div><b>${k}</b> → ${PQC[k][0]}</div>`).join('')}</div>`;
function sim(){const{X,Y,Z}=S;['X','Y','Z'].forEach(k=>{const e=$('#v'+k);if(e)e.textContent=S[k]});const o=$('#so');if(!o)return;const m=Math.max(X+Y,Z)+2,w=380/m,hit=X+Y>=Z;o.innerHTML=`<svg viewBox="0 0 420 110" width="100%"><rect x="10" y="30" width="${X*w}" height="26" rx="4" fill="#36AFFF"/><rect x="${10+X*w}" y="30" width="${Y*w}" height="26" rx="4" fill="#28E0D0"/><line x1="${10+Z*w}" x2="${10+Z*w}" y1="12" y2="76" stroke="#ff4d5e" stroke-width="3"/><text x="${10+Z*w}" y="10" text-anchor="middle" font-size="11" fill="#ff4d5e">Z=${Z}</text><text x="12" y="92" font-size="11" fill="#8ea3bf">■ X lifetime ${X}  ■ Y migration ${Y}</text></svg><div style="font-size:30px;font-weight:700">${X+Y} ${hit?'≥':'<'} ${Z}</div><span class="tag" style="background:${hit?'#ff4d5e':'#38d996'}">${hit?'PRIORITISE MIGRATION':'LOWER IMMEDIATE URGENCY'}</span><p style="color:var(--mu)">${hit?'Protection plus migration window reaches the assumed threat horizon: prioritise assessment and planning.':'The window ends before the assumed horizon.'}</p>`}
async function run(files){go('sc');const lg=$('#log'),pr=$('#pr'),ks=Object.keys(files);pr.textContent='Scanning…';for(const k of ks){lg.innerHTML+=`› scanning ${esc(k)}<br>`;lg.scrollTop=1e5;await new Promise(r=>setTimeout(r,260))}S.a=detect(files);S.t=new Date().toLocaleTimeString();lg.innerHTML+=`✔ ${S.a.length} cryptographic references found. CBOM generated.<br>`;pr.innerHTML=`<button class="btn" onclick="go('inv')">View inventory →</button>`}
const demo=()=>run(DEMO);
async function unzip(buf){const d=new DataView(buf),u=new Uint8Array(buf),td=new TextDecoder();let e=u.length-22;while(e>=0&&d.getUint32(e,true)!=0x06054b50)e--;if(e<0)throw 0;const n=d.getUint16(e+10,true);let p=d.getUint32(e+16,true);const E=[];for(let i=0;i<n&&d.getUint32(p,true)==0x02014b50;i++){const m=d.getUint16(p+10,true),cs=d.getUint32(p+20,true),us=d.getUint32(p+24,true),nl=d.getUint16(p+28,true),xl=d.getUint16(p+30,true),cl=d.getUint16(p+32,true),lo=d.getUint32(p+42,true),name=td.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;E.push({name,m,cs,us,lo})}return{E,async read(x){const s=x.lo+30+d.getUint16(x.lo+26,true)+d.getUint16(x.lo+28,true),b=u.subarray(s,s+x.cs);if(x.m==0)return td.decode(b);if(x.m==8)return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();return''}}}
async function up(f){if(!f)return;if(f.size>1e7)return alert('ZIP too large (10 MB max).');let z;try{z=await unzip(await f.arrayBuffer())}catch(e){return alert('Not a valid ZIP file.')}const F={};let n=0,skip=0;for(const x of z.E){const p=x.name;if(p.endsWith('/'))continue;if(p.includes('..')||p[0]=='/'||p.includes('\\')){skip++;continue}if(!/\.(py|js|ts|java|go|cs|cpp|c|conf|yaml|yml|json|txt|pem|crt|properties|xml|ini|env)$/i.test(p)||x.us>1e6)continue;if(++n>300)break;try{F[p]=(await z.read(x)).slice(0,2e5)}catch(e){}}if(!Object.keys(F).length)return alert('No supported source/config files found in this ZIP.');run(F)}
